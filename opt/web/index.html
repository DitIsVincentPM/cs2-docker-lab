const CH = [
{t:'1 · Introductie & concepten', b:`
## Waarom containers?
"It works on my machine" — een container verpakt een applicatie **met al zijn afhankelijkheden** (libraries, runtime, config) zodat hij overal hetzelfde draait: laptop, server, cloud. Solomon Hykes stelde Docker voor in 2013 (PyCon) — de metafoor is de **zeecontainer**: één standaardformaat, ongeacht de inhoud.

## Container vs Virtuele Machine
| | Virtuele Machine | Container |
|---|---|---|
| Virtualiseert | **hardware** (hypervisor) | het **besturingssysteem** |
| Eigen kernel | ja, volledig gast-OS | nee, **deelt de host-kernel** |
| Grootte | GB's | MB's |
| Opstarten | minuten | (milli)seconden |
| Isolatie | sterk | lichter (proces-niveau) |
| Dichtheid | tientallen per host | honderden per host |

> Een container is in essentie gewoon een **geïsoleerd proces** op de host. Daarom kan je geen Windows-container op een Linux-kernel draaien (Docker Desktop op Windows/Mac gebruikt daarvoor een kleine Linux-VM).

## Linux-technologieën onder de motorkap
- **Namespaces** → *isolatie* (wat een proces kan **zien**): \`pid\` (eigen proceslijst, je app is PID 1), \`net\` (eigen netwerkstack), \`mnt\` (eigen bestandssysteem), \`uts\` (eigen hostname), \`ipc\`, \`user\` (eigen UID-mapping).
- **Control groups (cgroups)** → *resource-beperking* (hoeveel een proces mag **gebruiken**): CPU, geheugen, I/O. Bv. \`docker run --memory 256m --cpus 0.5\`.
- **Union filesystem (OverlayFS)** → een image bestaat uit **read-only layers** op elkaar gestapeld; een container voegt één dunne **read-write layer** toe (copy-on-write).

## Kernbegrippen
- **Image**: read-only sjabloon (bestandssysteem + metadata zoals CMD, ENV, poorten). Opgebouwd uit layers. Vergelijk: een *klasse*.
- **Container**: een draaiende (of gestopte) **instantie** van een image, met een eigen schrijflaag. Vergelijk: een *object*. Eén image → veel containers.
- **Registry**: opslagplaats voor images (Docker Hub, GitHub Container Registry, Google Artifact Registry, zelf gehost \`registry:2\`). Een **repository** bevat alle tags van één image.
- **Tag**: label voor een versie, bv. \`nginx:1.27-alpine\`. Geen tag = \`latest\` (betekent *niet* automatisch "nieuwste"!).
- **Dockerfile**: recept om een image te bouwen.

## Architectuur
Docker is **client-server**:
- **Docker client** (\`docker\` CLI) — stuurt commando's via een REST-API
- **Docker daemon** (\`dockerd\`) — bouwt, draait en beheert containers; praat met **containerd** → **runc** (OCI-runtime die effectief namespaces/cgroups opzet)
- Communicatie via de Unix-socket \`/var/run/docker.sock\`
- **OCI** (Open Container Initiative): open standaard voor image-formaat en runtime → images werken ook in Podman, Kubernetes, ...

## Wat gebeurt er bij \`docker run hello-world\`?
1. De client vraagt de daemon de container te starten
2. Image niet lokaal? De daemon **pullt** ze van Docker Hub
3. De daemon **maakt een container** en start het programma
4. De output wordt naar de client gestreamd. Programma klaar → container **Exited**
`},
{t:'2 · Docker CLI', b:`
## Levenscyclus
\`created → running → paused → stopped (exited) → removed\`

| Commando | Doet |
|---|---|
| \`docker run [opties] IMAGE [CMD]\` | pull + create + start |
| \`docker create\` / \`docker start\` | enkel aanmaken / starten |
| \`docker stop\` | SIGTERM, na 10 s SIGKILL |
| \`docker kill\` | onmiddellijk SIGKILL |
| \`docker restart\`, \`pause\`, \`unpause\` | |
| \`docker rm [-f]\` | container verwijderen (\`-f\` = ook als hij draait) |
| \`docker ps\` / \`docker ps -a\` | draaiende / alle containers |
| \`docker logs [-f] [--tail 20]\` | stdout/stderr van de container |
| \`docker exec -it NAAM sh\` | extra proces (shell) in **draaiende** container |
| \`docker attach\` | koppel aan het hoofdproces (PID 1) |
| \`docker inspect\` | alle details als JSON (\`-f '{{.State.Status}}'\`) |
| \`docker stats\` / \`top\` | resource-gebruik / processen |
| \`docker cp\` | bestanden kopiëren host ↔ container |

## Belangrijke \`run\`-opties
| Optie | Betekenis |
|---|---|
| \`-d\` | detached (achtergrond) |
| \`-it\` | interactief + terminal (\`-i\` stdin open, \`-t\` TTY) |
| \`--name web\` | naam geven (anders random, bv. \`happy_turing\`) |
| \`--rm\` | container automatisch verwijderen als hij stopt |
| \`-p 8080:80\` | **host**poort 8080 → **container**poort 80 |
| \`-P\` | alle EXPOSE-poorten op random hostpoorten |
| \`-e KEY=val\` / \`--env-file f\` | environment-variabelen |
| \`-v naam:/pad\` | named volume |
| \`-v /host/pad:/pad[:ro]\` | bind mount |
| \`--network net\` | netwerk kiezen |
| \`--restart unless-stopped\` | restart policy (\`no\`, \`on-failure\`, \`always\`, \`unless-stopped\`) |
| \`-w /app\`, \`-u 1000\` | werkmap, user |
| \`--entrypoint\` | ENTRYPOINT overschrijven |

## Images
| | |
|---|---|
| \`docker pull nginx:alpine\` | downloaden |
| \`docker images\` / \`docker image ls\` | lijst |
| \`docker rmi IMAGE\` | verwijderen (eerst containers weg, of \`-f\`) |
| \`docker tag SRC DEST\` | extra naam/tag (zelfde IMAGE ID!) |
| \`docker commit CONTAINER img:tag\` | image maken van een container |
| \`docker history IMG\` | layers bekijken |
| \`docker save -o f.tar\` / \`load -i\` | image ↔ tar-bestand |
| \`docker system prune [-a] [--volumes]\` | opkuisen |
| \`docker system df\` | schijfgebruik |

## Data: volumes, bind mounts, tmpfs
Alles in de **schrijflaag** van een container verdwijnt met \`docker rm\`. Persistente data:
| Type | Syntax | Beheerd door | Gebruik |
|---|---|---|---|
| **Named volume** | \`-v dbdata:/var/lib/mysql\` | Docker (\`/var/lib/docker/volumes/\`) | databases, persistente data |
| **Anonymous volume** | \`-v /data\` | Docker, random naam | tijdelijk |
| **Bind mount** | \`-v $(pwd)/site:/usr/share/nginx/html\` | jij (pad op host) | code delen tijdens development, config-bestanden |
| **tmpfs** | \`--tmpfs /tmp\` | RAM | gevoelige/tijdelijke data |

Commando's: \`docker volume create · ls · inspect · rm · prune\`. Een volume kan door **meerdere containers tegelijk** gedeeld worden. Lange syntax: \`--mount type=bind,source=/pad,target=/pad,readonly\`.

## Netwerken
| Driver | |
|---|---|
| \`bridge\` | standaard; privé-netwerk op de host (\`docker0\`, 172.17.0.0/16) met NAT |
| **user-defined bridge** | \`docker network create mynet\` → **ingebouwde DNS**: containers vinden elkaar **op naam** |
| \`host\` | geen netwerkisolatie; container gebruikt het netwerk van de host (\`-p\` heeft geen zin) |
| \`none\` | geen netwerk |
| \`overlay\` | over meerdere hosts (Swarm) |

Commando's: \`docker network ls|create|inspect|connect|disconnect|rm\`. Basis-checks: \`docker exec c ping andere\`, \`ip a\`, \`cat /etc/resolv.conf\` (DNS 127.0.0.11 in user-defined networks).

> ⚠️ Op de **default** bridge werkt naam-resolutie **niet**, enkel IP.
`},
{t:'3 · Docker Compose', b:`
## Wat?
Compose definieert een **multi-container applicatie** declaratief in één YAML-bestand (\`compose.yaml\`, vroeger \`docker-compose.yml\`). In plaats van 5 lange \`docker run\`-commando's: één \`docker compose up\`.

## Structuur
\`\`\`yaml
services:            # de containers
  web:
    build: .                 # of: image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db           # of map-vorm  DB_HOST: db
    env_file: .env
    volumes:
      - ./src:/app           # bind mount (pad begint met . of /)
      - webdata:/data        # named volume
    depends_on:
      - db
    networks: [front, back]
    restart: unless-stopped
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: geheim
    volumes:
      - dbdata:/var/lib/mysql
    networks: [back]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s

volumes:             # named volumes declareren
  webdata:
  dbdata:

networks:            # optioneel, anders 1 default netwerk
  front:
  back:
\`\`\`

## YAML-regels
- **Spaties**, geen tabs! Inspringing bepaalt de structuur
- \`key: value\` (spatie na de dubbele punt), lijsten met \`- \`
- Poorten tussen **aanhalingstekens** (\`"8080:80"\`) — anders kan YAML \`xx:yy\` als getal in grondtal 60 lezen
- Commentaar met \`#\`

## Wat doet Compose automatisch?
- Een **project** (naam = mapnaam, of \`-p\` / \`name:\`)
- Een netwerk \`<project>_default\` waarop alle services zitten → **servicenaam = DNS-naam** (\`db\`, \`redis\`)
- Containernamen \`<project>-<service>-1\`
- Volumes \`<project>_<volume>\`

## Commando's
| | |
|---|---|
| \`docker compose up -d\` | alles aanmaken en starten (detached) |
| \`docker compose up -d --build\` | eerst images (her)bouwen |
| \`docker compose down\` | containers + netwerk verwijderen |
| \`docker compose down -v\` | **ook volumes** (data weg!) |
| \`docker compose ps\` / \`logs -f [svc]\` | status / logs |
| \`docker compose exec db bash\` | shell in service |
| \`docker compose stop\` / \`start\` / \`restart\` | |
| \`docker compose pull\` / \`build\` | |
| \`docker compose up -d --scale web=3\` | meerdere instanties (geen vaste hostpoort dan!) |
| \`docker compose config\` | valideren + uitgewerkte config tonen |

## depends_on
Regelt enkel de **startvolgorde**. Wachten tot de db echt klaar is → healthcheck + \`depends_on: db: condition: service_healthy\`.

## Load balancer-voorbeeld (lab extra)
Meerdere \`web\`-replica's achter een **nginx** die als *reverse proxy* \`proxy_pass http://web:80;\` doet. Docker-DNS geeft voor \`web\` alle IP's terug (round-robin). Delen ze een named volume, dan tonen ze dezelfde inhoud.

## Bekende labs
WordPress + MariaDB · Nextcloud · Immich · Forgejo (self-hosted git) · nginx reverse proxy · load balancer.
`},
{t:'4 · Images bouwen (Dockerfile)', b:`
## Instructies
| Instructie | Betekenis |
|---|---|
| \`FROM image:tag [AS naam]\` | base image (verplicht, eerste instructie; \`scratch\` = leeg) |
| \`WORKDIR /app\` | werkmap (wordt aangemaakt); geldt voor RUN/CMD/COPY |
| \`COPY src dest\` | bestanden uit de **build context** kopiëren |
| \`ADD src dest\` | als COPY + URL's en automatisch tar uitpakken → **liever COPY** |
| \`RUN cmd\` | commando uitvoeren **tijdens het bouwen** → nieuwe layer |
| \`ENV KEY=val\` | env-variabele, ook beschikbaar **at runtime** |
| \`ARG KEY=def\` | variabele **enkel tijdens build** (\`--build-arg KEY=x\`) |
| \`EXPOSE 80\` | **documentatie** welke poort de app gebruikt (publiceert niets!) |
| \`USER app\` | volgende instructies + container draaien als deze user |
| \`VOLUME /data\` | mountpoint markeren (anoniem volume bij run) |
| \`LABEL key=val\` | metadata |
| \`CMD [...]\` | **standaard** commando/argumenten bij start (overschrijfbaar) |
| \`ENTRYPOINT [...]\` | het **vaste** uitvoerbare programma |
| \`HEALTHCHECK CMD curl -f http://localhost/ \\|\\| exit 1\` | gezondheidscontrole |

## Bouwen
\`\`\`bash
docker build -t naam:tag .          # . = build context (map die naar de daemon gaat)
docker build -t app -f Dockerfile.prod .
docker build --no-cache -t app .
\`\`\`
\`.dockerignore\` sluit bestanden uit de context uit (\`node_modules\`, \`.git\`, \`bin/ obj/\`, secrets) → sneller en veiliger.

## Layers & cache
- Elke \`RUN\`, \`COPY\`, \`ADD\` maakt een **layer**. Andere instructies (ENV, CMD, EXPOSE...) enkel metadata.
- Docker hergebruikt een layer uit de **cache** zolang de instructie én (bij COPY) de bestanden niet gewijzigd zijn. **Wijzigt één layer, dan worden alle volgende layers opnieuw gebouwd.**
- ⇒ Zet wat **zelden wijzigt bovenaan**: eerst \`COPY package.json\` + \`RUN npm install\`, pas daarna \`COPY . .\`.
- Combineer RUN-commando's en ruim op in **dezelfde** layer:
  \`RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*\`
  (verwijderen in een latere layer maakt de image niet kleiner!)

## CMD vs ENTRYPOINT
\`\`\`dockerfile
ENTRYPOINT ["ping", "-c", "3"]
CMD ["localhost"]
\`\`\`
- \`docker run img\` → \`ping -c 3 localhost\`
- \`docker run img 8.8.8.8\` → \`ping -c 3 8.8.8.8\` (argumenten **vervangen CMD**)
- \`docker run --entrypoint sh img\` → entrypoint overschrijven
- Enkel CMD → \`docker run img ls\` vervangt het hele commando
- Meerdere CMD's → enkel de **laatste** telt

**Exec-vorm** \`["prog","arg"]\` (aanbevolen): geen shell, je proces is **PID 1** en krijgt SIGTERM bij \`docker stop\`.
**Shell-vorm** \`prog arg\`: draait als \`/bin/sh -c "prog arg"\` → variabele-expansie, maar signalen bereiken je app niet.

## Security: niet als root
Standaard draait een container als **root**. Beter:
\`\`\`dockerfile
RUN addgroup -S app && adduser -S app -G app     # alpine
# debian: RUN useradd -m app
USER app
\`\`\`
Officiële images hebben vaak al een user (\`node\` in node-images, \`nginx\` in nginx). Een niet-root user kan **geen poorten < 1024** openen → *No root for nginx*-lab: luister op 8080, gebruik \`nginxinc/nginx-unprivileged\` of pas de config aan.

## Voorbeeld node.js
\`\`\`dockerfile
FROM node:22-alpine
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
EXPOSE 3000
USER node
CMD ["node", "app.js"]
\`\`\`

## Voorbeeld Python/Flask
\`\`\`dockerfile
FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
CMD ["flask", "run", "--host=0.0.0.0"]
\`\`\`
> In een container moet je app luisteren op **0.0.0.0**, niet op 127.0.0.1 (dat is de container zelf).
`},
{t:'5 · Multi-stage builds', b:`
## Probleem
Om te **bouwen** heb je een SDK/compiler nodig (golang ~800 MB, dotnet/sdk ~800 MB, node + devDependencies). Om te **draaien** enkel het resultaat. Alles in één image = groot, traag, en meer aanvalsoppervlak.

## Oplossing: meerdere \`FROM\`'s in één Dockerfile
\`\`\`dockerfile
# ---- stage 1: build ----
FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /src
COPY *.csproj ./
RUN dotnet restore              # aparte layer → cache!
COPY . .
RUN dotnet publish -c Release -o /app/publish

# ---- stage 2: runtime ----
FROM mcr.microsoft.com/dotnet/aspnet:8.0
WORKDIR /app
COPY --from=build /app/publish .
EXPOSE 8080
ENTRYPOINT ["dotnet", "MijnApp.dll"]
\`\`\`
- Elke \`FROM\` start een nieuwe **stage**; geef ze een naam met \`AS\`
- \`COPY --from=build\` haalt bestanden uit een eerdere stage (of uit een image: \`COPY --from=nginx:alpine /etc/nginx/nginx.conf .\`)
- **Enkel de laatste stage** komt in de uiteindelijke image
- \`docker build --target build .\` → stop bij een bepaalde stage (bv. voor tests)

## Voorbeelden van runtime-images
| Taal | build-stage | runtime-stage |
|---|---|---|
| .NET | \`dotnet/sdk\` | \`dotnet/aspnet\` (web) of \`dotnet/runtime\` |
| Go | \`golang\` | \`alpine\`, \`distroless\` of zelfs \`scratch\` (statische binary) |
| Java | \`maven\` / \`gradle\` | \`eclipse-temurin:21-jre\` |
| Node (React/Vue) | \`node\` → \`npm run build\` | \`nginx:alpine\` met de \`dist/\` map |
| Python | \`python\` (wheels bouwen) | \`python:slim\` |

## Voordelen
✔ veel kleinere image · ✔ geen broncode/compiler/secrets in productie-image · ✔ één Dockerfile voor build én run (geen aparte build-scripts) · ✔ betere caching
`},
{t:'6 · Images publiceren', b:`
## Naamgeving
\`\`\`
[registry-host[:poort]/][namespace/]repository[:tag]
nginx                          → docker.io/library/nginx:latest
jouwnaam/myapp:1.0              → docker.io/jouwnaam/myapp:1.0
localhost:5000/myapp:1.0       → lokale registry
europe-west1-docker.pkg.dev/project-id/repo/myapp:1.0   → Google Artifact Registry
ghcr.io/user/myapp:1.0         → GitHub
\`\`\`
Push gaat naar de registry die **in de naam** staat → je moet eerst **taggen**.

## Docker Hub
\`\`\`bash
docker login                      # gebruikersnaam + access token
docker tag myapp:1.0 jouwnaam/myapp:1.0
docker push jouwnaam/myapp:1.0
docker pull jouwnaam/myapp:1.0
docker logout
\`\`\`
Public repo's: iedereen kan pullen; private: enkel na login. Credentials komen in \`~/.docker/config.json\`.

## Lokale registry
\`\`\`bash
docker run -d -p 5000:5000 --name registry registry:2
docker tag myapp:1.0 localhost:5000/myapp:1.0
docker push localhost:5000/myapp:1.0
curl localhost:5000/v2/_catalog                 # repository-lijst (Registry HTTP API v2)
curl localhost:5000/v2/myapp/tags/list
\`\`\`
Vanaf een ander toestel zonder HTTPS → \`insecure-registries\` in \`/etc/docker/daemon.json\`.

## Google Cloud — Artifact Registry
\`\`\`bash
gcloud auth login
gcloud config set project PROJECT_ID
gcloud artifacts repositories create myrepo --repository-format=docker --location=europe-west1
gcloud auth configure-docker europe-west1-docker.pkg.dev
docker tag myapp:1.0 europe-west1-docker.pkg.dev/PROJECT_ID/myrepo/myapp:1.0
docker push europe-west1-docker.pkg.dev/PROJECT_ID/myrepo/myapp:1.0
\`\`\`
> ⚠️ Bouw je op een Mac met Apple-chip (arm64) voor de cloud (amd64): \`docker build --platform linux/amd64\`.

## Tag-strategie
Gebruik **vaste versies** (\`1.4.2\`, git-sha) voor productie; \`latest\` is gewoon een tag zoals een andere en wordt niet automatisch bijgewerkt.
`},
{t:'7 · Serverless containers (Cloud Run)', b:`
## Wat is serverless?
Je levert enkel een **container image**; de cloudprovider regelt servers, schaling, TLS, load balancing. **Google Cloud Run** = fully managed, serverless container-platform (gebaseerd op **Knative**).

## Kenmerken
- **Schaalt automatisch** op basis van requests, ook **naar nul** (geen verkeer = geen kosten)
- **Betalen per gebruik** (CPU/geheugen tijdens requests), gratis tier
- **Stateless**: geen lokale persistente opslag → data in een database / Cloud Storage
- Container moet luisteren op de poort uit de env-variabele **\`PORT\`** (standaard **8080**) en op **0.0.0.0**
- Elke service krijgt een **HTTPS-URL** (\`https://service-xxxx.run.app\`)
- **Cold start**: eerste request na schaal-naar-nul is trager (min-instances > 0 voorkomt dit)
- **Concurrency**: meerdere requests per instantie (standaard 80)
- Revisies: elke deploy = nieuwe **revision**, verkeer kan gesplitst worden

## Deployen
Via de **Console**: Cloud Run → Create service → image-URL kiezen (bv. \`us-docker.pkg.dev/cloudrun/container/hello\`), regio, *Allow unauthenticated*, poort.

Via **gcloud**:
\`\`\`bash
gcloud run deploy hello \\
  --image europe-west1-docker.pkg.dev/PROJECT/repo/hello:1.0 \\
  --region europe-west1 \\
  --allow-unauthenticated \\
  --port 8080
gcloud run services list
gcloud run services delete hello --region europe-west1
\`\`\`
Of direct vanuit broncode: \`gcloud run deploy --source .\` (Cloud Build bouwt de image).

## Serverless vs eigen VM met Docker
| | Cloud Run | VM + Docker |
|---|---|---|
| Beheer | geen servers | OS, updates, Docker zelf |
| Schaling | automatisch, tot 0 | manueel |
| Kosten | per request | per uur dat VM draait |
| State | stateless | volumes mogelijk |
| Geschikt | web-API's, microservices | databases, langlopende processen |

Labs: hello-world container, **httpbin**, een backend-API voor een **Android-app**.
`}

let fcDeck=[], fcI=0;
function renderCards(){
  const known = store.get('known',{});

  <button class="btn small" onclick="startCards(-1)">Enkel nog niet gekend</button>
  <span class="muted" style="margin-left:auto">${Object.values(known).filter(Boolean).length}/${FC.length} gekend</span></div>
  <div id="fcarea"></div>`;

function startCards(ch){
  store.set('fcch',ch);
  const known=store.get('known',{});
  fcDeck=FC.map((f,i)=>i).filter(i=>ch===0||ch===FC[i][0]||(ch===-1&&!known[i])).sort(()=>Math.random()-.5);
  fcI=0;drawCard();
}
function drawCard(){
  const a=$('#fcarea');
  if(!fcDeck.length||fcI>=fcDeck.length){a.innerHTML=`<div class="card"><h2>🎉 Stapel klaar!</h2><p>Kies hierboven een nieuwe stapel, of "Enkel nog niet gekend".</p></div>`;renderProgOnly();return}
  const i=fcDeck[fcI],f=FC[i];
  a.innerHTML=`<div class="bar"><i style="width:${fcI/fcDeck.length*100}%"></i></div><div class="muted">${fcI+1} / ${fcDeck.length} · klik of druk <b>spatie</b> om te draaien</div>
  <div class="fc" id="fc"><div class="fc-in"><div class="fc-f"><span class="tag">${CH[f[0]-1].t}</span>${md(f[1])}</div><div class="fc-b">${md(f[2])}</div></div></div>
  <div class="row" style="justify-content:center"><button class="btn" style="border-color:var(--bad)" onclick="rate(false)">✘ Nog niet (1)</button><button class="btn ok" onclick="rate(true)">✔ Gekend (2)</button></div>`;
  $('#fc').onclick=()=>$('#fc').classList.toggle('flip');
}
function rate(k){const known=store.get('known',{});known[fcDeck[fcI]]=k;store.set('known',known);if(!k)fcDeck.push(fcDeck[fcI]);fcI++;drawCard();updProg()}
document.addEventListener('keydown',e=>{
  if(!$('#cards').classList.contains('on')||!$('#fc'))return;
  if(e.code==='Space'){e.preventDefault();$('#fc').classList.toggle('flip')}
  if(e.key==='1')rate(false); if(e.key==='2')rate(true);
});

let qz=null;
function renderQuiz(){
  const best=store.get('qbest',{});
  const chs=[...new Set(Q.map(q=>q.c))];
  const wrong=store.get('qwrong',[]);
  $('#quizbody').innerHTML=`<h1>Quiz</h1>
  <div class="card"><h3 style="margin-top:0">🎓 Examensimulatie</h3><p class="muted">25 willekeurige vragen uit alles, geen feedback tot het einde, timer. Lijkt het meest op de Canvas-toets.</p>
  <button class="btn primary" onclick="startQuiz('exam')">Start examen</button> ${best.exam!=null?`<span class="muted">beste score: ${best.exam}%</span>`:''}</div>
  <div class="card"><h3 style="margin-top:0">📚 Oefenen per hoofdstuk</h3><p class="muted">Directe feedback + uitleg.</p><div class="row">
  <button class="btn" onclick="startQuiz(0)">Alles (${Q.length})</button>
  ${chs.map(c=>`<button class="btn" onclick="startQuiz(${c})">${CH[c-1].t} ${best[c]!=null?`<span class="muted">· ${best[c]}%</span>`:''}</button>`).join('')}</div></div>
  ${wrong.length?`<div class="card"><h3 style="margin-top:0">🔁 Foute vragen herhalen</h3><button class="btn" onclick="startQuiz('wrong')">Herhaal ${wrong.length} vragen</button></div>`:''}`;
}
function quizChapter(i){show('quiz');startQuiz(i+1)}
function startQuiz(mode){
  let idx=Q.map((q,i)=>i);
  if(typeof mode==='number'&&mode>0)idx=idx.filter(i=>Q[i].c===mode);
  if(mode==='wrong')idx=store.get('qwrong',[]);
  idx.sort(()=>Math.random()-.5);
  if(mode==='exam')idx=idx.slice(0,25);
  qz={mode,idx,i:0,score:0,ans:[],t0:Date.now()};
  drawQ();
}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ').replace(/^\$\s*/,'').replace(/["']/g,'');
function drawQ(){
  const b=$('#quizbody');
  if(qz.i>=qz.idx.length)return endQuiz();
  const q=Q[qz.idx[qz.i]],exam=qz.mode==='exam';
  b.innerHTML=`<div class="row"><button class="btn small" onclick="renderQuiz()">← terug</button><span class="muted">Vraag ${qz.i+1}/${qz.idx.length}</span>
  ${exam?`<span class="muted" id="timer" style="margin-left:auto"></span>`:`<span class="muted" style="margin-left:auto">score ${qz.score}</span>`}</div>
  <div class="bar"><i style="width:${qz.i/qz.idx.length*100}%"></i></div>
  <div class="card"><span class="tag">${CH[q.c-1].t}</span><div style="font-size:17px">${md(q.q)}</div>
  ${q.f?`<input class="fill" id="fill" placeholder="${q.a[0].startsWith('docker')||q.a[0].startsWith('-')?'typ het commando…':'typ je antwoord…'}" autocomplete="off" spellcheck="false"><div class="row" style="margin-top:10px"><button class="btn primary" id="sub">Controleer (Enter)</button></div>`
       :q.o.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${md(o).replace(/^<p>|<\/p>\n?$/g,'')}</button>`).join('')}
  <div id="fb"></div></div>`;
  if(exam){const tick=()=>{const e=$('#timer');if(!e)return;const s=Math.floor((Date.now()-qz.t0)/1000);e.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;setTimeout(tick,1000)};tick()}
  if(q.f){const inp=$('#fill');inp.focus();const go=()=>answer(q.a.map(norm).includes(norm(inp.value)),inp.value);$('#sub').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
  else b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>answer(+o.dataset.i===q.a,+o.dataset.i));
}
function answer(ok,given){
  const qi=qz.idx[qz.i],q=Q[qi];
  if(ok)qz.score++;
  qz.ans.push({qi,ok,given});
  let w=store.get('qwrong',[]);w=w.filter(x=>x!==qi);if(!ok)w.push(qi);store.set('qwrong',w);
  if(qz.mode==='exam'){qz.i++;return drawQ()}
  const b=$('#quizbody');
  if(q.f){$('#fill').disabled=true;$('#sub').remove()}
  else b.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===q.a)o.classList.add('good');else if(+o.dataset.i===given)o.classList.add('wrong')});
  $('#fb').innerHTML=`<div class="expl"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'✔ Juist!':'✘ Fout'}</b>
   ${q.f?`<div>Juist antwoord: <code>${q.a[0]}</code></div>`:''}${q.e?md(q.e):''}</div>
   <div class="row" style="margin-top:12px"><button class="btn primary" id="nx">Volgende (Enter) →</button></div>`;
  const nx=()=>{document.removeEventListener('keydown',kh);qz.i++;drawQ()};
  const kh=e=>{if(e.key==='Enter'){e.preventDefault();nx()}};
  setTimeout(()=>document.addEventListener('keydown',kh),50);
  $('#nx').onclick=nx;
}
function endQuiz(){
  const pct=Math.round(qz.score/qz.idx.length*100);
  const best=store.get('qbest',{}),key=qz.mode==='exam'?'exam':qz.mode;
  if(key!=='wrong'&&(best[key]==null||pct>best[key])){best[key]=pct;store.set('qbest',best)}
  const s=Math.floor((Date.now()-qz.t0)/1000);
  $('#quizbody').innerHTML=`<div class="card" style="text-align:center"><h1 style="font-size:46px;margin:10px">${pct}%</h1>
  <p>${qz.score} / ${qz.idx.length} juist · ${Math.floor(s/60)}m${s%60}s · op 20: <b>${Math.round(pct/5)}</b></p>
  <p>${pct>=80?'🔥 Klaar voor het examen!':pct>=50?'👍 Geslaagd, maar herhaal de fouten.':'📖 Nog even de theorie herlezen.'}</p>
  <div class="row" style="justify-content:center"><button class="btn primary" onclick="renderQuiz()">Terug</button></div></div>
  ${qz.ans.filter(a=>!a.ok).map(a=>{const q=Q[a.qi];return `<div class="card"><span class="tag">fout</span>${md(q.q)}
   <div>Jouw antwoord: <code>${q.f?(a.given||'(leeg)'):q.o[a.given]}</code></div>
   <div>Juist: <code>${q.f?q.a[0]:q.o[q.a]}</code></div>${q.e?`<div class="expl">${md(q.e)}</div>`:''}</div>`}).join('')}`;
  updProg();
}

let EX=[],cur=null,curFile=null,dirty=false;
async function loadLab(force){
  if(EX.length&&!force)return;
  try{EX=await (await fetch('/api/ex')).json()}catch{$('#expane').innerHTML='<p>Kan de sandbox niet bereiken.</p>';return}
  drawExList();openEx(store.get('ex',EX[0].id));
}
function drawExList(){
  const done=store.get('exdone',{});
  $('#exlist').innerHTML='<div class="muted" style="font-size:12px;padding:4px 8px">OEFENINGEN</div>'+EX.map(e=>`<button data-id="${e.id}" class="${cur&&cur.id===e.id?'on':''}">${e.md.split('\n')[0].replace(/^#\s*/,'')}<span class="d">${done[e.id]?'✔':''}</span></button>`).join('');
  $('#exlist').querySelectorAll('button').forEach(b=>b.onclick=()=>openEx(b.dataset.id));
}
async function openEx(id){
  if(dirty&&!confirm('Niet-opgeslagen wijzigingen weggooien?'))return;
  cur=EX.find(e=>e.id===id)||EX[0];store.set('ex',cur.id);dirty=false;drawExList();
  const cdCmd=`cd /work/oefeningen/${cur.dir}`;
  $('#expane').innerHTML=md(cur.md)+
   `<div class="row" style="margin-top:6px"><span class="muted" style="font-size:13px">Map in terminal:</span><code>${cdCmd}</code><button class="btn small" onclick="copy('${cdCmd}')">kopieer</button></div>`+
   (cur.files.length?`<div class="ftabs">${cur.files.map(f=>`<button data-f="${f}">${f.split('/').slice(1).join('/')}</button>`).join('')}</div>
    <textarea id="ed" spellcheck="false"></textarea>
    <div class="row" style="margin-top:6px"><button class="btn" id="save">💾 Opslaan (Ctrl+S)</button><span class="muted" id="edstat" style="font-size:13px"></span></div>`:'')+
   `<div class="row" style="margin-top:16px"><button class="btn ok" id="chk">✔ Check mijn oplossing</button><button class="btn" id="solb">💡 Toon oplossing</button></div>
    <div id="checkout"></div><div id="sol" class="card"></div>`;
  $('#expane').scrollTop=0;
  if(cur.files.length){
    $('#expane').querySelectorAll('.ftabs button').forEach(b=>b.onclick=()=>openFile(b.dataset.f));
    const ed=$('#ed');
    ed.oninput=()=>{dirty=true;$('#edstat').textContent='● niet opgeslagen'};
    ed.onkeydown=e=>{
      if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart;ed.setRangeText('  ',s,ed.selectionEnd,'end');ed.oninput()}
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveFile()}
    };
    $('#save').onclick=saveFile;
    openFile(cur.files.find(f=>/Dockerfile|compose/.test(f))||cur.files[0]);
  }
  $('#chk').onclick=runCheck;
  $('#solb').onclick=async()=>{const s=$('#sol');if(s.style.display==='block'){s.style.display='none';return}
    s.innerHTML=md(await (await fetch('/api/sol/'+cur.id)).text());s.style.display='block';s.scrollIntoView({behavior:'smooth'})};
}
async function openFile(f){
  if(dirty&&!confirm('Niet-opgeslagen wijzigingen weggooien?'))return;
  curFile=f;dirty=false;
  $('#expane').querySelectorAll('.ftabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  $('#ed').value=await (await fetch('/api/file?p='+encodeURIComponent(f))).text();
  $('#edstat').textContent='/work/oefeningen/'+f;
}
async function saveFile(){
  const r=await fetch('/api/file?p='+encodeURIComponent(curFile),{method:'PUT',body:$('#ed').value});
  if(r.ok){dirty=false;$('#edstat').textContent='✔ opgeslagen · /work/oefeningen/'+curFile;toast('Opgeslagen')}else toast('Opslaan mislukt')
}
async function runCheck(){
  if(dirty)await saveFile();
  const o=$('#checkout');o.style.display='block';o.textContent='⏳ bezig met controleren…';
  const {out}=await (await fetch('/api/check/'+cur.id,{method:'POST'})).json();
  o.innerHTML=out.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^(\s*✔.*)$/gm,'<span class="g">$1</span>').replace(/^(\s*✘.*)$/gm,'<span class="r">$1</span>');
  if(/Alles juist/.test(out)){const d=store.get('exdone',{});d[cur.id]=true;store.set('exdone',d);drawExList();updProg();toast('🎉 Oefening '+cur.id+' geslaagd!')}
}

## Valkuilen
- \`-p HOST:CONTAINER\`, nooit omgekeerd
