name: cs2lab
services:
  sandbox:
    build: .
    image: cs2lab:latest
    container_name: cs2lab
    hostname: cs2lab
    privileged: true          # nodig voor Docker-in-Docker
    restart: unless-stopped
    environment:
      CS2_USER: ${CS2_USER:-student}
      CS2_PASS: ${CS2_PASS:-docker}
    volumes:
      - ./data:/var/lib/docker
      - ./work:/work
    ports:
      - "127.0.0.1:18080-18100:18080-18100"
